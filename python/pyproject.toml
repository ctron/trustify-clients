[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustify-client"
version = "0.1.0"
description = "Python client for the Trustify software supply-chain security API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "attrs>=22.2.0",
    "httpx[brotli,zstd]>=0.28.1",
]

[dependency-groups]
generate = [
    "openapi-python-client==0.29.1",
    "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trustify_client*"]
