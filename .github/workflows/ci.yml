name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: rust
        run: cargo test --workspace --all-features

      - name: Verify generated API is current
        run: |
          scripts/generate-rust.sh
          git diff --exit-code -- rust/trustify-client/src/api_generated.rs

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust

      - name: Check wasm32 compilation
        working-directory: rust
        run: cargo check --target wasm32-unknown-unknown -p trustify-client

      - name: Run Clippy for wasm32
        working-directory: rust
        run: cargo clippy --target wasm32-unknown-unknown -p trustify-client -- -D warnings

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python client and generator
        run: |
          python3 -m venv python/.venv
          python/.venv/bin/pip install -e python \
            'openapi-python-client==0.29.1' \
            'PyYAML==6.0.2' \
            'ruff==0.16.9'

      - name: Run Python tests
        run: python/.venv/bin/python -m unittest discover -s python/tests

      - name: Verify generated API is current
        run: |
          PATH="$GITHUB_WORKSPACE/python/.venv/bin:$PATH" python/.venv/bin/python scripts/generate-python.py
          git diff --exit-code -- python/trustify_client/generated
          if [ -n "$(git ls-files --others --exclude-standard -- python/trustify_client/generated)" ]; then
            echo "::error::Generated Python files are missing from version control"
            exit 1
          fi
